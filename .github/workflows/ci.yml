name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-smoke-test:
    runs-on: ubuntu-latest
    env:
      DB_PATH: /tmp/quiz-ci.sqlite3

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Behavioral regression suite
        run: |
          docker compose version
          python -m pytest -q

      - name: Validate deployment shell syntax
        run: bash -n deploy.sh

      - name: Check Python syntax
        run: python -m compileall app scripts

      - name: Check JSON syntax for question bank files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          paths = sorted(Path("content/questions").rglob("*.json"))
          if not paths:
              raise SystemExit("No question JSON files found")

          for path in paths:
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)
              print(f"OK {path}")
          PY

      - name: Validate question bank JSON
        run: python scripts/validate_questions.py

      - name: Validate topic registry
        run: python scripts/validate_topics.py

      - name: Validate glossary
        run: python scripts/validate_glossary.py

      - name: Validate literature
        run: python scripts/validate_literature.py

      - name: Check for whitespace and merge marker issues
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PR_BASE:-${PUSH_BASE:-HEAD^}}"
          if [[ "$base" == 0000000000000000000000000000000000000000 ]]; then base=HEAD^; fi
          git diff --check "$base" HEAD

      - name: Initialize temporary database
        run: python scripts/init_db.py

      - name: Seed questions into temporary database
        run: python scripts/seed_questions.py

      - name: Verify serving content parity
        run: python scripts/audit_question_bank.py --db-path "$DB_PATH"

      - name: Write CI summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### CI validation summary"
            echo "- behavioral pytest suite and compose contract passed"
            echo "- deployment shell syntax and failure paths passed"
            echo "- compileall passed"
            echo "- JSON syntax passed"
            echo "- validate_questions passed"
            echo "- validate_topics passed"
            echo "- validate_glossary passed"
            echo "- validate_literature passed"
            echo "- DB init/seed smoke passed"
            echo "- git diff --check passed"
          } >> "$GITHUB_STEP_SUMMARY"
