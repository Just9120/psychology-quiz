name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pwa-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_DB: psychology_test
          POSTGRES_PASSWORD: synthetic-admin-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d psychology_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned frontend tooling and real backend
        run: |
          npm install --global npm@12.0.2
          npm ci --ignore-scripts
          pip install -r ../requirements.txt
      - name: Components, types and production build
        env:
          PWA_BUILD_SHA: ${{ github.sha }}
        run: |
          npm test
          npm run build
          npm run build:miniapp
          git diff --exit-code -- ../miniapp-react
          test -z "$(git ls-files --others --exclude-standard ../miniapp-react)"
      - name: Browser regression with temporary SQLite and synthetic mail
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Browser regression after reconciled PostgreSQL import
        env:
          POSTGRES_TEST_ADMIN_DSN: postgresql://postgres:synthetic-admin-only@127.0.0.1:5432/psychology_test
          POSTGRES_TEST_DSN: postgresql://psychology_test_app:synthetic-test-only@127.0.0.1:5432/psychology_test
        run: |
          python ../scripts/postgres_test_support.py
          npm run test:e2e
      - name: Validate HTTPS release and Nginx routing template
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
          python tests/nginx_smoke.py
      - name: Upload versioned public assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pwa-${{ github.sha }}
          path: pwa/dist/
          if-no-files-found: error
          retention-days: 7

  validate-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_DB: psychology_test
          POSTGRES_PASSWORD: synthetic-admin-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d psychology_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_PATH: /tmp/quiz-ci.sqlite3
      POSTGRES_TEST_ADMIN_DSN: postgresql://postgres:synthetic-admin-only@127.0.0.1:5432/psychology_test
      POSTGRES_TEST_DSN: postgresql://psychology_test_app:synthetic-test-only@127.0.0.1:5432/psychology_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Behavioral regression suite
        env:
          POSTGRES_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker compose version
          python scripts/postgres_test_support.py
          python -m pytest -q

      - name: Validate deployment shell syntax
        run: bash -n deploy.sh

      - name: Check Python syntax
        run: python -m compileall app scripts

      - name: Check JSON syntax for question bank files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          paths = sorted(Path("content/questions").rglob("*.json"))
          if not paths:
              raise SystemExit("No question JSON files found")

          for path in paths:
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)
              print(f"OK {path}")
          PY

      - name: Validate question bank JSON
        run: python scripts/validate_questions.py

      - name: Validate topic registry
        run: python scripts/validate_topics.py

      - name: Validate glossary
        run: python scripts/validate_glossary.py

      - name: Validate literature
        run: python scripts/validate_literature.py

      - name: Check for whitespace and merge marker issues
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PR_BASE:-${PUSH_BASE:-HEAD^}}"
          if [[ "$base" == 0000000000000000000000000000000000000000 ]]; then base=HEAD^; fi
          git diff --check "$base" HEAD

      - name: Initialize temporary database
        run: python scripts/init_db.py

      - name: Seed questions into temporary database
        run: python scripts/seed_questions.py

      - name: Verify serving content parity
        run: python scripts/audit_question_bank.py --db-path "$DB_PATH"

      - name: Write CI summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### CI validation summary"
            echo "- behavioral pytest suite and compose contract passed"
            echo "- deployment shell syntax and failure paths passed"
            echo "- compileall passed"
            echo "- JSON syntax passed"
            echo "- validate_questions passed"
            echo "- validate_topics passed"
            echo "- validate_glossary passed"
            echo "- validate_literature passed"
            echo "- DB init/seed smoke passed"
            echo "- git diff --check passed"
          } >> "$GITHUB_STEP_SUMMARY"
