services:
  psych_quiz_bot:
    image: psychology-quiz-runtime:${APP_REVISION:-local}
    pull_policy: never
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:-UNSET}
    container_name: psych_quiz_bot
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-m", "app.main"]
    volumes:
      - ./data:/data
      - ./content:/app/content:ro
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      MINIAPP_LEGACY_API_ENABLED: "false"
      APP_REVISION: ${APP_REVISION:-UNSET}

  psych_quiz_miniapp_api:
    image: psychology-quiz-runtime:${APP_REVISION:-local}
    pull_policy: never
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:-UNSET}
    container_name: psych_quiz_miniapp_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_REVISION: ${APP_REVISION:-UNSET}
    command: ["uvicorn", "app.miniapp_fastapi_runtime:app", "--host", "0.0.0.0", "--port", "8081"]
    volumes:
      - ./data:/data
      - ./content:/app/content:ro
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=3); b=json.load(r); raise SystemExit(0 if r.status==200 and b.get('ok') is True else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  psych_quiz_postgres:
    profiles: ["postgres"]
    image: pgvector/pgvector:0.8.6-pg18-bookworm@sha256:1d50c689b0a6511b9ea0a15615281c81a59fd04a08eb35057ec8646fb3a2118a
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums"
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_error_statement=panic"]
    volumes:
      - ./.postgres/data:/var/lib/postgresql
    secrets:
      - postgres_admin_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  psych_quiz_private_search:
    profiles: ["search"]
    build:
      context: .
      dockerfile: Dockerfile.search
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      SEARCH_MODEL_CACHE: /data/search-model-cache
      PRIVATE_RAG_ENABLED: "0"
    volumes:
      - ./.private-search/input:/data/search-input:ro
      - ./.private-search/model-cache:/data/search-model-cache

secrets:
  postgres_admin_password:
    file: ./.postgres/admin.password
